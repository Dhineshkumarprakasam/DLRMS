spring.application.name=frontend-service
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${DLRMS_COOKIE_SECURE:false}

services.personnel.base-url=${PERSONNEL_SERVICE_URL:http://localhost:8081/api/personnel}
services.personnel.auth-url=${PERSONNEL_AUTH_URL:http://localhost:8081/api/authenticate}
services.supplies.base-url=${SUPPLIES_SERVICE_URL:http://localhost:8082/api/supplies}