<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defense Logistics | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <h2>Test</h2>
<nav class="navbar navbar-dark bg-dark">
    <div class="container"><a class="navbar-brand" th:href="@{/login}">Defense Logistics</a></div>
</nav>

<main class="container py-5" style="max-width: 480px">
    <h1 class="h3 mb-1">Sign in</h1>
    <p class="text-secondary mb-4">Use your force number and password.</p>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">You have been logged out.</div>

    <form th:action="@{/login}" method="post" id="loginForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="forceNumber">Force number</label>
            <input class="form-control" id="forceNumber" name="forceNumber" autocomplete="username"
                   maxlength="30" required th:value="${forceNumber}">
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" id="loginButton" type="submit">
            <span id="loginLabel">Login</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" aria-hidden="true"></span>
        </button>
    </form>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', () => {
        const button = document.getElementById('loginButton');
        button.disabled = true;
        document.getElementById('loginLabel').textContent = 'Signing in';
        document.getElementById('loginSpinner').classList.remove('d-none');
    });
</script>
</body>
</html>
