<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defense Logistics | Personnel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Defense Logistics</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/}">All modules</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h1 class="h3 mb-1">Personnel management</h1>
    <p class="text-secondary">Basic personnel records and availability</p>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header" th:text="${user.id == null ? 'Add personnel' : 'Edit personnel'}">Add personnel</div>
                <div class="card-body">
                    <form th:action="@{/submit-personnel}" th:object="${user}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label">Service number</label>
                            <input class="form-control" th:field="*{serviceNumber}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rank</label>
                            <input class="form-control" th:field="*{rank}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <input class="form-control" th:field="*{role}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Unit ID</label>
                            <input class="form-control" type="number" th:field="*{unitId}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input class="form-control" th:field="*{currentLocation}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Availability</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="AVAILABLE">Available</option>
                                <option value="DEPLOYED">Deployed</option>
                                <option value="ON_LEAVE">On leave</option>
                                <option value="UNAVAILABLE">Unavailable</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" type="submit">Save personnel</button>
                        <a class="btn btn-outline-secondary" th:href="@{/personnel}">Clear</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">Personnel records</div>
                <div class="table-responsive">
                    <table class="table table-striped mb-0">
                        <thead>
                        <tr><th>Service no.</th><th>Name</th><th>Rank / role</th><th>Unit</th><th>Location</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="person : ${personnel}">
                            <td th:text="${person.serviceNumber}"></td>
                            <td th:text="${person.name}"></td>
                            <td><span th:text="${person.rank}"></span><span th:if="${person.role != null}"> / </span><span th:text="${person.role}"></span></td>
                            <td th:text="${person.unitId}"></td>
                            <td th:text="${person.currentLocation}"></td>
                            <td th:text="${person.status}"></td>
                            <td class="text-nowrap">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/edit-personnel(id=${person.id})}">Edit</a>
                                <form class="d-inline" th:action="@{/delete-personnel}" method="post">
                                    <input type="hidden" name="id" th:value="${person.id}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(personnel)}">
                            <td colspan="7" class="text-center text-secondary">No personnel records yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
