<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defense Logistics | Equipment</title>
    <link th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Defense Logistics</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">All modules</a>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <header class="mb-4">
        <h1 class="h3 mb-1">Equipment management</h1>
        <p class="text-secondary mb-0">Track equipment details, assignments, condition, and location.</p>
    </header>

    <div class="row g-4">
        <div class="col-lg-4">
            <section class="card shadow-sm">
                <div class="card-header" th:text="${equipment.id == null ? 'Register equipment' : 'Edit equipment'}">Register equipment</div>
                <div class="card-body">
                    <form th:action="@{/submit-equipment}" th:object="${equipment}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" for="serialNumber">Serial number</label>
                            <input class="form-control" id="serialNumber" type="text" th:field="*{serialNumber}" maxlength="50" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="name">Equipment name</label>
                            <input class="form-control" id="name" type="text" th:field="*{name}" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="category">Category</label>
                            <input class="form-control" id="category" type="text" th:field="*{category}" maxlength="50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="status">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="AVAILABLE">Available</option>
                                <option value="ASSIGNED">Assigned</option>
                                <option value="MAINTENANCE">Maintenance</option>
                                <option value="DECOMMISSIONED">Decommissioned</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="operationalCondition">Operational condition</label>
                            <select class="form-select" id="operationalCondition" th:field="*{operationalCondition}">
                                <option value="SERVICEABLE">Serviceable</option>
                                <option value="UNSERVICEABLE">Unserviceable</option>
                                <option value="REPAIRABLE">Repairable</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="location">Current location</label>
                            <input class="form-control" id="location" type="text" th:field="*{location}" maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="unitId">Unit ID</label>
                            <input class="form-control" id="unitId" type="number" min="0" th:field="*{unitId}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="ownership">Ownership</label>
                            <input class="form-control" id="ownership" type="text" th:field="*{ownership}" maxlength="100">
                        </div>
                        <button class="btn btn-primary" type="submit">Save equipment</button>
                        <a class="btn btn-outline-secondary" th:href="@{/equipment}">Clear</a>
                    </form>
                </div>
            </section>
        </div>

        <div class="col-lg-8">
            <section class="card shadow-sm">
                <div class="card-header">Registered equipment</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Serial number</th>
                            <th scope="col">Equipment</th>
                            <th scope="col">Status / condition</th>
                            <th scope="col">Location</th>
                            <th scope="col">Unit</th>
                            <th scope="col">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${equipmentList}">
                            <td th:text="${item.serialNumber}"></td>
                            <td>
                                <strong th:text="${item.name}"></strong><br>
                                <small class="text-secondary" th:text="${item.category}"></small>
                            </td>
                            <td>
                                <span th:text="${item.status}"></span><br>
                                <small class="text-secondary" th:text="${item.operationalCondition}"></small>
                            </td>
                            <td th:text="${item.location}"></td>
                            <td th:text="${item.unitId}"></td>
                            <td class="text-nowrap">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/edit-equipment(id=${item.id})}">Edit</a>
                                <form class="d-inline" th:action="@{/delete-equipment}" method="post">
                                    <input type="hidden" name="id" th:value="${item.id}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(equipmentList)}">
                            <td colspan="6" class="text-center text-secondary py-4">No equipment registered yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
