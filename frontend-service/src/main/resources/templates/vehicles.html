<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defense Logistics | Vehicles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Defense Logistics</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/}">All modules</a>
        </div>
    </nav>

    <main class="container py-4">
        <header class="mb-4">
            <h1 class="h3 mb-1">Vehicle management</h1>
            <p class="text-secondary mb-0">Manage vehicle records, availability, and operational status.</p>
        </header>

        <section class="card shadow-sm mb-4">
            <div class="card-header">
                <h2 class="h5 mb-0">Register a vehicle</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/submit-vehicle}" th:object="${vehicle}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="registrationNo">Registration Number</label>
                            <input class="form-control" id="registrationNo" type="text" th:field="*{registrationNo}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="type">Type</label>
                            <input class="form-control" id="type" type="text" th:field="*{type}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="model">Model</label>
                            <input class="form-control" id="model" type="text" th:field="*{model}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="capacity">Capacity</label>
                            <input class="form-control" id="capacity" type="number" th:field="*{capacity}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="fuelType">Fuel Type</label>
                            <input class="form-control" id="fuelType" type="text" th:field="*{fuelType}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="ownerUnitId">Owner Unit ID</label>
                            <input class="form-control" id="ownerUnitId" type="number" th:field="*{ownerUnitId}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="location">Location</label>
                            <input class="form-control" id="location" type="text" th:field="*{location}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="status">Status</label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option value="AVAILABLE">Available</option>
                                <option value="ALLOCATED">Allocated</option>
                                <option value="UNDER_MAINTENANCE">Under Maintenance</option>
                                <option value="DECOMMISSIONED">Decommissioned</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="condition">Condition</label>
                            <select class="form-select" id="condition" th:field="*{condition}">
                                <option value="GOOD">Good</option>
                                <option value="FAIR">Fair</option>
                                <option value="POOR">Poor</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="odometerKm">Odometer (km)</label>
                            <input class="form-control" id="odometerKm" type="number" th:field="*{odometerKm}">
                        </div>
                    </div>

                    <button class="btn btn-primary mt-3" type="submit">Save Vehicle</button>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header">
                <h2 class="h5 mb-0">Registered vehicles</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Registration Number</th>
                            <th scope="col">Type</th>
                            <th scope="col">Model</th>
                            <th scope="col">Status</th>
                            <th scope="col">Location</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${vehicles}">
                            <td th:text="${item.registrationNo}"></td>
                            <td th:text="${item.type}"></td>
                            <td th:text="${item.model}"></td>
                            <td th:text="${item.status}"></td>
                            <td th:text="${item.location}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(vehicles)}">
                            <td colspan="5" class="text-center text-secondary py-4">No vehicles registered yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
